project:
  name: stockml
  data_dir: ./data
  random_seed: 42

universe:
  countries: [KR, US]
  kr_market: KOSPI                  # KOSDAQ 제외
  us_index: SP500                   # S&P 500 만
  exclude_etfs: true

prices:
  frequency: quarterly              # 분기말 종가
  source_kr: pykrx
  source_us: yfinance

targets:
  attractiveness:
    max_horizon_years: 5            # 최대 5년 윈도우
    log_base: 5                     # log_5 고정
    use_max_in_window: true
    min_forward_quarters: 4         # 최소 1년 이상의 데이터 필요

  risk:
    max_horizon_years: 5
    annualization_factor: 4         # 분기 → 연환산 √4
    min_forward_quarters: 4

train_split:
  train_end: '2017-12-31'
  val_start: '2018-01-01'
  val_end: '2019-12-31'
  test_start: '2020-01-01'
  test_end: '2021-12-31'

model:
  # LSTM_stock: 종목 재무 시계열 인코더
  lstm_stock_hidden: 128      # 양방향이므로 출력 256
  lstm_stock_layers: 2
  lstm_stock_dropout: 0.2
  lstm_stock_max_seq: 20      # 최대 20분기(5년) 과거

  # LSTM_macro: 거시 시계열 인코더
  lstm_macro_hidden: 64       # 단방향, 출력 64
  lstm_macro_layers: 1
  lstm_macro_max_seq: 20

  # ThemeContext Linear 투영
  theme_proj_dim: 64          # 16 → 64

  # FT-Transformer
  d_token: 192                # 피처 임베딩 차원 (192 = 8 heads × 24)
  n_heads: 8
  n_layers: 4
  ffn_factor: 1.333           # FFN hidden = d_token × ffn_factor
  dropout: 0.2
  attn_dropout: 0.1

  # 학습
  lr: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  batch_size: 64              # M1 Pro 16GB
  max_epochs: 60
  patience: 10
  use_wandb: false            # WandB 사용 여부 (추가 기술)

  # M1 Pro
  num_workers: 0
  persistent_workers: false
  pin_memory: false           # MPS 미지원
  precision: '32-true'

device:
  prefer: mps
  fallback: cpu
